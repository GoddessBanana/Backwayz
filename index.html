<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackWayz</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #173d30;
}

header {
  color: white;
  text-align: center;
  padding: 12px;
}

.search-box {
  padding: 12px;
  background: #173d30;
}

#start,
#destination {
  width: 100%;
  padding: 15px;
  box-sizing: border-box;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}

#map {
  height: 65vh;
}

button {
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #a6f4c5;
}

footer {
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>BackWayz</h1>
  <p>The road less traveled.</p>
</header>

<div class="search-box">
<input
  id="start"
  type="text"
  placeholder="Current location or enter starting address"
  style="margin-bottom:8px;"
>
  <input
  id="destination"
  type="text"
  placeholder="Where do you want to go?"
>

<button onclick="buildRoute()" style="width:100%; margin-top:8px;">

<select id="routeMode" style="
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:10px;
  font-size:16px;
">
  <option value="fastest">Fastest Route</option>
  <option value="avoidHighways">Avoid Highways</option>
  <option value="backwayz">BackWayz Route</option>
</select>
  Go
</button>
</div>

<div id="map"></div>

<footer>
  <button onclick="findMe()">Find My Location</button>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([44.3, -69.1], 7);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

function findMe() {
  navigator.geolocation.getCurrentPosition(
    p => map.setView(
      [p.coords.latitude, p.coords.longitude],
      14
    ),
    () => alert('Please allow location access.')
  );
}
let routeLine;
let startMarker;
let destinationMarker;

async function geocodeAddress(address) {
  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`
  );

  const results = await response.json();

  if (!results.length) {
    throw new Error(`Could not find: ${address}`);
  }

  return {
    lat: Number(results[0].lat),
    lon: Number(results[0].lon),
    name: results[0].display_name
  };
}

function getCurrentLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      position => {
        resolve({
          lat: position.coords.latitude,
          lon: position.coords.longitude,
          name: "Current location"
        });
      },
      () => reject(new Error("Could not get your current location")),
      {
        enableHighAccuracy: true,
        timeout: 10000
      }
    );
  });
}

async function buildRoute() {
  const startInput = document.getElementById('start').value.trim();
  const destinationInput = document.getElementById('destination').value.trim();
const routeMode = document.getElementById('routeMode').value;

  if (!destinationInput) {
    alert("Enter a destination.");
    return;
  }

  try {
    const start = startInput
      ? await geocodeAddress(startInput)
      : await getCurrentLocation();

    const destination = await geocodeAddress(destinationInput);

    let costingOptions = {
  use_highways: 0.5,
  use_tolls: 0.5,
  use_living_streets: 0.1,
  use_tracks: 0
};

if (routeMode === 'avoidHighways') {
  costingOptions = {
    use_highways: 0,
    use_tolls: 0.2,
    use_living_streets: 0.2,
    use_tracks: 0
  };
}

if (routeMode === 'backwayz') {
  costingOptions = {
    use_highways: 0,
    use_tolls: 0,
    use_living_streets: 0.8,
    use_tracks: 0
  };
}

const valhallaRequest = {
  locations: [
    {
      lat: start.lat,
      lon: start.lon
    },
    {
      lat: destination.lat,
      lon: destination.lon
    }
  ],
  costing: "auto",
  costing_options: {
    auto: costingOptions
  },
  units: "miles",
  format: "osrm",
  shape_format: "geojson"
};

const routeResponse = await fetch(
  'https://valhalla1.openstreetmap.de/route?json=' +
  encodeURIComponent(JSON.stringify(valhallaRequest))
);

if (!routeResponse.ok) {
  throw new Error("Could not calculate this route.");
}

const routeData = await routeResponse.json();

    if (!routeData.routes || !routeData.routes.length) {
      throw new Error("No route found");
    }

    if (routeLine) {
      map.removeLayer(routeLine);
    }

    if (startMarker) {
      map.removeLayer(startMarker);
    }

    if (destinationMarker) {
      map.removeLayer(destinationMarker);
    }

    routeLine = L.geoJSON(routeData.routes[0].geometry).addTo(map);

    startMarker = L.marker([start.lat, start.lon])
      .addTo(map)
      .bindPopup(start.name);

    destinationMarker = L.marker([destination.lat, destination.lon])
      .addTo(map)
      .bindPopup(destination.name);

    map.fitBounds(routeLine.getBounds(), {
      padding: [40, 40]
    });

  } catch (error) {
    alert(error.message || "Could not build the route.");
  }
}

document.getElementById('destination').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    buildRoute();
  }
});

document.getElementById('start').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    buildRoute();
  }
});
</script>

</body>
</html>
