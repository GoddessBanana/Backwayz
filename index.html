<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackWayz</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #173d30;
}

header {
  color: white;
  text-align: center;
  padding: 12px;
}

.search-box {
  padding: 12px;
  background: #173d30;
}

#destination {
  width: 100%;
  padding: 15px;
  box-sizing: border-box;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}

#map {
  height: 65vh;
}

button {
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #a6f4c5;
}

footer {
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>BackWayz</h1>
  <p>The road less traveled.</p>
</header>

<div class="search-box">
  <input
    id="destination"
    type="text"
    placeholder="Where do you want to go?"
  >
</div>

<div id="map"></div>

<footer>
  <button onclick="findMe()">Find My Location</button>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([44.3, -69.1], 7);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

function findMe() {
  navigator.geolocation.getCurrentPosition(
    p => map.setView(
      [p.coords.latitude, p.coords.longitude],
      14
    ),
    () => alert('Please allow location access.')
  );
}
let routeLine;

document.getElementById('destination').addEventListener('keydown', async function(event) {
  if (event.key !== 'Enter') return;
  event.preventDefault();

  const address = this.value.trim();
  if (!address) return;

  if (!navigator.geolocation) {
    alert('GPS is not available.');
    return;
  }

  try {
    const search = await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
      encodeURIComponent(address)
    );

    if (!search.ok) throw new Error('Address search failed');

    const results = await search.json();

    if (!results.length) {
      alert('Address not found.');
      return;
    }

    const destination = [
      Number(results[0].lat),
      Number(results[0].lon)
    ];

    navigator.geolocation.getCurrentPosition(async function(position) {
      try {
        const start = [
          position.coords.latitude,
          position.coords.longitude
        ];

        const url =
          'https://router.project-osrm.org/route/v1/driving/' +
          start[1] + ',' + start[0] + ';' +
          destination[1] + ',' + destination[0] +
          '?overview=full&geometries=geojson';

        const response = await fetch(url);
        if (!response.ok) throw new Error('Routing failed');

        const data = await response.json();

        if (!data.routes || !data.routes.length) {
          alert('No driving route found.');
          return;
        }

        if (routeLine) map.removeLayer(routeLine);

        const coordinates = data.routes[0].geometry.coordinates
          .map(point => [point[1], point[0]]);

        routeLine = L.polyline(coordinates, {
          color: 'blue',
          weight: 5
        }).addTo(map);

        map.fitBounds(routeLine.getBounds());

        L.marker(start).addTo(map).bindPopup('Your location');
        L.marker(destination).addTo(map).bindPopup(address);

      } catch (error) {
        alert('Could not calculate the route.');
      }
    }, function() {
      alert('Please allow location access to calculate your route.');
    }, {
      enableHighAccuracy: true,
      timeout: 15000
    });

  } catch (error) {
    alert('Could not find that address.');
  }
});
</script>

</body>
</html>
