<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackWayz</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #173d30;
}

header {
  color: white;
  text-align: center;
  padding: 12px;
}

.search-box {
  padding: 12px;
  background: #173d30;
}

#destination {
  width: 100%;
  padding: 15px;
  box-sizing: border-box;
  border-radius: 12px;
  border: 1px solid #ccc;
  font-size: 16px;
}

#map {
  height: 65vh;
}

button {
  padding: 15px;
  border: 0;
  border-radius: 10px;
  background: #a6f4c5;
}

footer {
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>BackWayz</h1>
  <p>The road less traveled.</p>
</header>

<div class="search-box">
  <input
    id="destination"
    type="text"
    placeholder="Where do you want to go?"
  >
</div>

<div id="map"></div>

<footer>
  <button onclick="findMe()">Find My Location</button>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([44.3, -69.1], 7);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

function findMe() {
  navigator.geolocation.getCurrentPosition(
    p => map.setView(
      [p.coords.latitude, p.coords.longitude],
      14
    ),
    () => alert('Please allow location access.')
  );
}
document.getElementById('destination').addEventListener('keydown', async function(event) {
  if (event.key !== 'Enter') return;

  event.preventDefault();

  const address = this.value.trim();
  if (!address) return;

  try {
    const response = await fetch(
      'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' +
      encodeURIComponent(address)
    );

    if (!response.ok) throw new Error('Search failed');

    const results = await response.json();

    if (results.length === 0) {
      alert('Address not found. Try a more specific address.');
      return;
    }

    const lat = Number(results[0].lat);
    const lon = Number(results[0].lon);

    map.setView([lat, lon], 14);

    L.marker([lat, lon])
      .addTo(map)
      .bindPopup(results[0].display_name)
      .openPopup();

  } catch (error) {
    alert('Address search failed. Please try again.');
  }
});
</script>

</body>
</html>
