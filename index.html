<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BackWayz</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>
:root {
  --blurple: #5865F2;
  --pink: #FF007F;
  --charcoal: #1A1A24;
  --white: #FFFFFF;
  --light: #F7F7FB;
}

body {
  margin: 0;
  font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
  background: var(--charcoal);
  color: var(--white);
}

header {
  background: var(--charcoal);
  text-align: center;
  padding: 6px;
}

header h1 {
  margin: 4px 0;
  font-size: 28px;
  font-weight: 900;
  color: var(--blurple);
  text-shadow: 0 0 12px rgba(88, 101, 242, 0.35);
}

header p {
  margin: 2px 0 6px;
  color: var(--white);
  font-size: 13px;
  opacity: 0.9;
}

.search-box {
  padding: 6px;
  background: var(--charcoal);
}

#start,
#destination {
  width: 100%;
  padding: 8px 10px;
  box-sizing: border-box;
  border-radius: 8px;
  border: 2px solid var(--blurple);
  background: var(--white);
  color: var(--charcoal);
  font-size: 14px;
  outline: none;
}

#start:focus,
#destination:focus {
  border-color: var(--pink);
  box-shadow: 0 0 0 2px rgba(255, 0, 127, 0.18);
}

button {
  padding: 10px 14px;
  border: 0;
  border-radius: 9px;
  background: var(--blurple);
  color: var(--white);
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(88, 101, 242, 0.25);
}

button:hover,
button:active {
  background: var(--pink);
}

#routeInfo {
  display: none;
  margin: 6px 0;
  padding: 8px 10px;

  background: var(--charcoal);
  color: var(--white);

  border: 2px solid var(--blurple);
  border-radius: 9px;

  font-size: 13px;
  line-height: 1.25;

  box-shadow: 0 3px 10px rgba(0,0,0,.28);
}

#routeInfo strong {
  color: var(--pink);
  font-size: 14px;
}

#currentTurn,
#directions,
#routeMenu {
  background: rgba(26, 26, 36, 0.97);
  color: var(--white);
  border: 2px solid var(--blurple);
  box-shadow: 0 4px 16px rgba(0,0,0,0.35);
}

.route-active,
.direction-step.active {
  background: var(--pink);
  color: var(--white);
  border-radius: 8px;
}

#mapContainer {
  position: relative;
  height: 68vh;
}

#map {
  width: 100%;
  height: 100%;
}

#currentTurn {
  display: none;
  position: absolute;
  left: 8px;
  bottom: 8px;
  z-index: 1000;

  width: 220px;
  max-width: 42%;

  padding: 10px;

  background: rgba(26, 26, 36, 0.97);
  color: white;

  border: 2px solid var(--pink);
  border-radius: 10px;

  box-shadow: 0 4px 16px rgba(0,0,0,.4);
  font-size: 13px;
}

#directions {
  display: none;
  position: absolute;
  right: 8px;
  bottom: 52px;
  z-index: 1050;

  width: 230px;
  max-width: 48%;
  max-height: 180px;

  overflow-y: auto;

  background: rgba(26, 26, 36, 0.97);
  color: white;

  border: 2px solid var(--blurple);
  border-radius: 10px;

  padding: 10px;
  font-size: 12px;

  box-shadow: 0 4px 16px rgba(0,0,0,.4);
}

#optionsToggle {
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 1200;

  padding: 8px 13px;

  background: var(--blurple);
  color: white;

  border: 0;
  border-radius: 9px;

  font-size: 13px;
  font-weight: 800;

  box-shadow: 0 3px 12px rgba(0,0,0,.4);
}

#optionsMenu {
  display: none;

  position: absolute;
  top: 52px;
  right: 10px;

  z-index: 1200;

  width: 190px;

  padding: 8px;

  background: rgba(26,26,36,.98);

  border: 2px solid var(--blurple);
  border-radius: 12px;

  box-shadow: 0 5px 18px rgba(0,0,0,.45);
}

#optionsMenu button {
  display: block;

  width: 100%;

  margin: 4px 0;
  padding: 9px;

  background: var(--blurple);
  color: white;

  border: 0;
  border-radius: 8px;

  font-size: 13px;
  font-weight: 700;
}

#optionsMenu button:hover,
#optionsMenu button:active {
  background: var(--pink);
}

#optionsMenu .route-selected {
  background: var(--pink);
}

.menu-title {
  padding: 5px 4px;
  color: white;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.menu-divider {
  height: 1px;
  margin: 7px 2px;
  background: var(--blurple);
}



footer {
  text-align: center;
  padding: 15px;
}
</style>
</head>

<body>

<header>
  <h1>BackWayz</h1>
  <p>The road less traveled.</p>
</header>

<div class="search-box">
<input
  id="start"
  type="text"
  placeholder="Current location or enter starting address"
  style="margin-bottom:8px;"
>
  <input
  id="destination"
  type="text"
  placeholder="Where do you want to go?"
>

<select id="routeMode" style="display:none;""
 
  <option value="fastest">Fastest Route</option>
  <option value="avoidHighways">Avoid Highways</option>
  <option value="backwayz">BackWayz Route</option>
</select>

<button onclick="buildRoute()" style="
  width:100%;
  margin-top:6px;
  padding:10px;
">
  Go
</button>

<div id="routeInfo">
</div>

<button
  id="startNavigation"
  onclick="startNavigation()"
  style="
    display:none;
    width:100%;
    margin-top:6px;
    padding:9px;
  "
>
  Start Navigation
</button>


</div>

<div id="mapContainer">

  <div id="map"></div>


 <button id="optionsToggle" onclick="toggleOptionsMenu()">
  Options ▾
</button>

<div id="optionsMenu">

  <div class="menu-title">Route</div>

  <button class="route-option" onclick="setRouteMode('fastest', this)">
    Fastest Route
  </button>

  <button class="route-option" onclick="setRouteMode('avoidHighways', this)">
    Avoid Highways
  </button>

  <button class="route-option" onclick="setRouteMode('backwayz', this)">
    BackWayz Route
  </button>

  <div class="menu-divider"></div>

  <button onclick="toggleDirections()">
    Show / Hide Directions
  </button>

</div>

  <div id="directions"></div>

</div>

  <div id="map"></div>

  <div id="currentTurn">
    <strong>Next turn</strong>
    <div id="currentTurnText">
      Start navigation to see your next turn.
    </div>
  </div>

</div>

<footer>
  <button onclick="findMe()">Find My Location</button>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map('map').setView([44.3, -69.1], 7);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors',
  maxZoom: 19
}).addTo(map);

function findMe() {
  navigator.geolocation.getCurrentPosition(
    p => map.setView(
      [p.coords.latitude, p.coords.longitude],
      14
    ),
    () => alert('Please allow location access.')
  );
}
let routeLine;
let startMarker;
let destinationMarker;

let navigationWatchId = null;
let navigationMarker = null;
let navigationSteps = [];
let currentNavigationStep = 0;
let routeCoordinates = [];

async function geocodeAddress(address) {
  const response = await fetch(
    `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`
  );

  const results = await response.json();

  if (!results.length) {
    throw new Error(`Could not find: ${address}`);
  }

  return {
    lat: Number(results[0].lat),
    lon: Number(results[0].lon),
    name: results[0].display_name
  };
}

function getCurrentLocation() {
  return new Promise((resolve, reject) => {
    navigator.geolocation.getCurrentPosition(
      position => {
        resolve({
          lat: position.coords.latitude,
          lon: position.coords.longitude,
          name: "Current location"
        });
      },
      () => reject(new Error("Could not get your current location")),
      {
        enableHighAccuracy: true,
        timeout: 10000
      }
    );
  });
}

async function buildRoute() {
  const startInput = document.getElementById('start').value.trim();
  const destinationInput = document.getElementById('destination').value.trim();
const routeMode = document.getElementById('routeMode').value;

  if (!destinationInput) {
    alert("Enter a destination.");
    return;
  }

  try {
    const start = startInput
      ? await geocodeAddress(startInput)
      : await getCurrentLocation();

    const destination = await geocodeAddress(destinationInput);

    let costingOptions = {
  use_highways: 0.5,
  use_tolls: 0.5,
  use_living_streets: 0.1,
  use_tracks: 0
};

if (routeMode === 'avoidHighways') {
  costingOptions = {
    use_highways: 0,
    use_tolls: 0.2,
    use_living_streets: 0.2,
    use_tracks: 0,
    exclude_highways: true
  };
}

if (routeMode === 'backwayz') {
  costingOptions = {
    use_highways: 0,
    use_tolls: 0,
    use_living_streets: 0.8,
    use_tracks: 0,
    exclude_highways: true
  };
}

const valhallaRequest = {
  locations: [
    {
      lat: start.lat,
      lon: start.lon
    },
    {
      lat: destination.lat,
      lon: destination.lon
    }
  ],
  costing: "auto",
  costing_options: {
    auto: costingOptions
  },
  units: "miles",
directions_options: {
  units: "miles"
}
};

const routeResponse = await fetch(
  'https://valhalla1.openstreetmap.de/route?json=' +
  encodeURIComponent(JSON.stringify(valhallaRequest))
);

if (!routeResponse.ok) {
  throw new Error("Could not calculate this route.");
}

const routeData = await routeResponse.json();

    if (!routeData.trip || !routeData.trip.legs || !routeData.trip.legs.length) {
  throw new Error("No route found");
}


const route = routeData.trip;

const miles = route.summary.length;
const minutes = Math.round(route.summary.time / 60);

const modeNames = {
  fastest: "Fastest Route",
  avoidHighways: "Avoid Highways",
  backwayz: "BackWayz Route"
};

let comparisonText = "";

let highwayWarning = "";

if (
  (routeMode === "avoidHighways" || routeMode === "backwayz") &&
  routeData.trip.summary.has_highway
) {
  highwayWarning =
    `<div style="
      margin-top:8px;
      padding:8px;
      border-radius:8px;
      background:#2A2030;
border:1px solid #FF007F;
color:#FFFFFF;
      font-size:14px;
    ">
      ⚠️ A completely highway-free route was not available.
      This route still includes some highway.
    </div>`;
}

if (routeMode !== "fastest") {

  const fastestRequest = {
    locations: [
      {
        lat: start.lat,
        lon: start.lon
      },
      {
        lat: destination.lat,
        lon: destination.lon
      }
    ],

    costing: "auto",

    costing_options: {
      auto: {
        use_highways: 0.5,
        use_tolls: 0.5,
        use_living_streets: 0.1,
        use_tracks: 0
      }
    },

    units: "miles",
    
  };

  try {
    const fastestResponse = await fetch(
      'https://valhalla1.openstreetmap.de/route?json=' +
      encodeURIComponent(JSON.stringify(fastestRequest))
    );

    const fastestData = await fastestResponse.json();

    if (fastestData.routes && fastestData.routes.length) {

      const fastestMinutes =
        Math.round(fastestData.routes[0].duration / 60);

      const extraMinutes = minutes - fastestMinutes;

      if (extraMinutes > 0) {
        comparisonText =
          ` • +${extraMinutes} min vs fastest`;
      }
    }

  } catch (error) {
    console.log("Fastest-route comparison unavailable.");
  }
}

const routeInfo =
  document.getElementById('routeInfo');

routeInfo.innerHTML =
  `<strong>${modeNames[routeMode]}</strong><br>` +
  `${miles.toFixed(1)} miles • ${minutes} min` +
  comparisonText +
  highwayWarning;

routeInfo.style.display = "block";

    if (routeLine) {
      map.removeLayer(routeLine);
    }

    if (startMarker) {
      map.removeLayer(startMarker);
    }

    if (destinationMarker) {
      map.removeLayer(destinationMarker);
    }

    function decodePolyline6(encoded) {
  let index = 0;
  let lat = 0;
  let lon = 0;
  const coordinates = [];

  while (index < encoded.length) {
    let result = 0;
    let shift = 0;
    let byte;

    do {
      byte = encoded.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);

    const deltaLat = (result & 1) ? ~(result >> 1) : (result >> 1);
    lat += deltaLat;

    result = 0;
    shift = 0;

    do {
      byte = encoded.charCodeAt(index++) - 63;
      result |= (byte & 0x1f) << shift;
      shift += 5;
    } while (byte >= 0x20);

    const deltaLon = (result & 1) ? ~(result >> 1) : (result >> 1);
    lon += deltaLon;

    coordinates.push([
      lat / 1e6,
      lon / 1e6
    ]);
  }

  return coordinates;
}

routeCoordinates = [];

routeData.trip.legs.forEach(leg => {
  routeCoordinates.push(...decodePolyline6(leg.shape));
});

routeLine = L.polyline(routeCoordinates, {
  weight: 5
}).addTo(map);

    startMarker = L.marker([start.lat, start.lon])
      .addTo(map)
      .bindPopup(start.name);

    destinationMarker = L.marker([destination.lat, destination.lon])
      .addTo(map)
      .bindPopup(destination.name);

    map.fitBounds(routeLine.getBounds(), {
      padding: [40, 40]
    });

const directionsBox = document.getElementById('directions');

let directionsHtml = '<strong>Turn-by-turn directions</strong><ol>';

navigationSteps = [];

navigationSteps = [];

let routeIndexOffset = 0;

routeData.trip.legs.forEach(leg => {
  const legCoordinates = decodePolyline6(leg.shape);

  leg.maneuvers.forEach(maneuver => {
    const localIndex = maneuver.begin_shape_index;
    const point = legCoordinates[localIndex];

    navigationSteps.push({
      instruction: maneuver.instruction,
      coordinate: point,
      routeIndex: routeIndexOffset + localIndex
    });

    directionsHtml += `
      <li class="direction-step" style="margin-bottom:8px;">
        ${maneuver.instruction}
      </li>
    `;
  });

  routeIndexOffset += legCoordinates.length;
});


directionsHtml += '</ol>';

directionsBox.innerHTML = directionsHtml;
directionsBox.style.display = 'block';
document.getElementById('startNavigation').style.display = 'block';
  } catch (error) {
    alert(error.message || "Could not build the route.");
  }
}

document.getElementById('destination').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    buildRoute();
  }
});

document.getElementById('start').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    event.preventDefault();
    buildRoute();
  }
});

function startNavigation() {
  if (!navigationSteps.length) {
    alert("Build a route first.");
    return;
  }

  if (!navigator.geolocation) {
    alert("GPS is not available on this device.");
    return;
  }

  currentNavigationStep = 0;

  if (navigationWatchId !== null) {
    navigator.geolocation.clearWatch(navigationWatchId);
  }

  navigationWatchId = navigator.geolocation.watchPosition(
    position => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;

      if (!navigationMarker) {
        navigationMarker = L.marker([lat, lon]).addTo(map);
      } else {
        navigationMarker.setLatLng([lat, lon]);
      }

      map.setView([lat, lon], 17);

      const steps = document.querySelectorAll('.direction-step');

      steps.forEach((step, index) => {
        step.style.fontWeight =
          index === currentNavigationStep ? 'bold' : 'normal';

       step.style.background =
  index === currentNavigationStep ? '#FF007F' : 'transparent';

step.style.color =
  index === currentNavigationStep ? '#FFFFFF' : '#FFFFFF';

        step.style.padding =
          index === currentNavigationStep ? '8px' : '0';
      });

      // Ignore very inaccurate GPS readings
if (position.coords.accuracy > 60) {
  return;
}

// Find the point on the route closest to the user's real GPS position
let nearestRouteIndex = 0;
let nearestDistance = Infinity;

routeCoordinates.forEach((point, index) => {
  const distance = map.distance([lat, lon], point);

  if (distance < nearestDistance) {
    nearestDistance = distance;
    nearestRouteIndex = index;
  }
});

// Don't advance directions if the user is too far away from the route
if (nearestDistance < 80) {

  let newStep = currentNavigationStep;

  for (let i = currentNavigationStep; i < navigationSteps.length; i++) {
    if (nearestRouteIndex >= navigationSteps[i].routeIndex) {
      newStep = i;
    } else {
      break;
    }
  }

  currentNavigationStep = newStep;
}
    },

    () => {
      alert("Please allow location access for navigation.");
    },

    {
      enableHighAccuracy: true,
      maximumAge: 1000,
      timeout: 15000
    }
  );
}

function toggleOptionsMenu() {
  const menu = document.getElementById('optionsMenu');

  menu.style.display =
    menu.style.display === 'block' ? 'none' : 'block';
}

function setRouteMode(mode, button) {
  document.getElementById('routeMode').value = mode;

  document.querySelectorAll('.route-option').forEach(btn => {
    btn.classList.remove('route-selected');
  });

  if (button) {
    button.classList.add('route-selected');
  }

  document.getElementById('optionsMenu').style.display = 'none';

  const destination =
    document.getElementById('destination').value.trim();

  if (destination) {
    buildRoute();
  }
}

function toggleDirections() {
  const directions = document.getElementById('directions');

  directions.style.display =
    directions.style.display === 'block'
      ? 'none'
      : 'block';

  document.getElementById('optionsMenu').style.display = 'none';
}

</script>

</body>
</html>
